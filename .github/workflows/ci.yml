name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned binary)
        run: |
          # The pinned release binary is used instead of gitleaks-action v2,
          # which requires GITLEAKS_LICENSE for repositories owned by an
          # organization (personal repositories are free). The binary itself
          # is MIT and requires nothing.
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz
      - name: gitleaks detect
        run: gitleaks detect --source . --no-banner

  go:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Tracks go.mod rather than pinning a duplicate version here, so
          # the toolchain floor is stated in exactly one place.
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # -race because this codebase runs control-mode clients, pumps and an
      # event engine concurrently; a data race there would surface as an
      # event stream that is subtly wrong rather than one that crashes.
      #
      # The driver integration tests are opt-in via FLEET_TMUX_INTEGRATION
      # and skip here: CI has no multiplexer and no sessions to look at.
      # That is deliberate — those tests assert against a live machine, and
      # a green CI run means the unit suite passed, not that the substrate
      # behaved.
      - name: go test -race
        run: go test -race ./...
